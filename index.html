<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>픽포켓</title>
<style>
:root{--bg:#f6f7f9;--card:#ffffff;--ink:#111827;--sub:#6b7280;--line:#e5e7eb;
--accent:#e5322d;--btn:#111827;--btn-ink:#ffffff;--badge:#111827}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 40px}
header{text-align:center;padding:8px 0 20px}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;
border:3px solid var(--card);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.avatar-fallback{width:84px;height:84px;border-radius:50%;background:var(--badge);
color:#fff;display:inline-flex;align-items:center;justify-content:center;
font-size:34px;font-weight:800}
h1{font-size:20px;font-weight:800;margin-top:12px}
.tagline{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.5}
.notice{font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);
border-radius:10px;padding:10px 12px;margin:4px 0 16px;text-align:center;line-height:1.5}
.search{width:100%;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);
border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:14px;outline:none}
.search:focus{border-color:var(--sub)}
.card{display:flex;align-items:center;gap:14px;background:var(--card);
border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;
text-decoration:none;color:inherit;transition:transform .06s ease}
.card:active{transform:scale(.985)}
.thumb{width:88px;height:88px;border-radius:12px;object-fit:cover;background:#eee;flex:none}
.thumb-fallback{width:88px;height:88px;border-radius:12px;background:#eceff3;flex:none;
display:flex;align-items:center;justify-content:center;font-size:30px}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:700;line-height:1.45;display:-webkit-box;
-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn{flex:none;background:var(--btn);color:var(--btn-ink);font-size:13px;font-weight:700;
border-radius:10px;padding:10px 14px;white-space:nowrap}
.sold{opacity:.45}
footer{margin-top:26px;text-align:center;font-size:11px;color:var(--sub);line-height:1.7}
@media(prefers-color-scheme:dark){
:root{--bg:#0f1115;--card:#1a1d24;--ink:#f3f4f6;--sub:#9ca3af;--line:#2a2e37;
--btn:#f3f4f6;--btn-ink:#111827;--badge:#f3f4f6}
.num,.avatar-fallback{color:#111827}
.thumb-fallback{background:#242832}}
</style>
</head><body>
<div class="wrap">
<header><div class="avatar-fallback">픽</div><h1>픽포켓</h1><div class="tagline">영상 속 제품, 번호로 찾아가세요</div></header>
<div class="notice">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
<input class="search" id="q" type="search" placeholder="👆 상품번호나 키워드로 검색해주세요"
 oninput="for(const c of document.querySelectorAll('.card'))c.style.display=c.dataset.k.includes(this.value.trim().toLowerCase())?'':'none'">
<a class="card" data-k="1 qcy 크로스스카이 링크 블루투스 이어폰 t22" href="https://www.coupang.com/vp/products/7188482040" target="_blank" rel="noopener sponsored">
  <img class="thumb" src="img/1.jpg" alt="" loading="lazy">
  <div class="info"><div class="name">1. QCY 크로스스카이 링크 블루투스 이어폰 T22</div></div>
  <span class="btn">구매하기</span>
</a>
<footer>이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>ⓒ 픽포켓</footer>
</div>
</body></html>
